# PromptHMR + SLAM WorldTransform + OAR Depth Refinement Pipeline (EMDB1)
#
# 在 WorldTransform 之后插入 OAR (Optical-Anchored Refinement) 组件，
# 利用 Metric3D 深度图 + 2D 重投影约束，以滑动窗口方式精修
# global_orient / body_pose / global_trans。
#
# Pipeline 流程：
#   1. Segmentation (SAM) - 人体分割
#   2. SLAM (DROID) - 相机运动估计（return_keyframe_info）
#   3. HPE (PromptHMR) - 人体姿态估计（static_cam=True）
#   4. WorldTransform - 用 SLAM c2w 变换到世界坐标系
#   5. DepthSceneRefine (OAR) - 滑动窗口光学锚定精修
#   6. SkatingRemoval - 滑步消除（pp_static_joint + IK）
#   7. Evaluation - 评估

name: "PromptHMR + OAR DepthRefine (EMDB1)"
mode: "sequential"
device: "cuda"
output_dir: "results/promptbase_video_depthrefine_emdb1"

components:
  # 1. 人体分割
  - type: segmentation
    name: human_segmentation
    backend: sam
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 2. 相机运动估计（DROID-SLAM, 保留关键帧信息）
  - type: slam
    name: camera_estimation
    backend: droid
    use_masks: true
    align_to_world: true
    return_keyframe_info: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 3. PromptHMR HPE（static_cam=True）
  - type: hpe
    name: gvhmr_preprocessing
    backend: prompthmr
    prompthmr_root: "../PromptHMR"
    gvhmr_root: "thirdparty/GVHMR"
    static_cam: true
    f_mm: null
    phmr_ckpt: "data/pretrain/phmr/checkpoint.ckpt"
    phmr_vid_cfg: "data/pretrain/phmr_vid/prhmr_release_002.yaml"
    phmr_vid_ckpt: "data/pretrain/phmr_vid/prhmr_release_002.ckpt"
    mask_prompt: true
    img_size: 896
    use_mean_shape: true
    substep_cache_use: true
    substep_cache_overwrite: false
    cache:
      enabled: true
      use_cache: true
      overwrite: true

  # 4. 世界坐标系变换
  - type: world_transform
    name: world_transform
    use_smooth_cam: true
    device: "cuda"
    cache:
      enabled: true
      use_cache: false
      overwrite: true

  # 5. OAR 深度精修（暂时禁用）
  # 问题分析（pa_mpjpe 36→54）：
  #   1. 无外部 2D 关键点时，reprojection target 是自身投影，零信息量
  #   2. floor_loss/contact_height 假设 y=0 是地面，但 SLAM 世界坐标系地面高度未知
  #   3. orient_refine 无有效锚定，delta 乱飘
  #   4. IK 在错误 delta 上进一步放大误差
  # 修复方向：接入 ViTPose 等独立 2D 检测器提供真实 reprojection target
  - type: depth_scene_refine
    name: oar_refine
    metric3d_model: "metric3d_vit_small"
    metric3d_root: "thirdparty/PromptHMR/pipeline/yvanyin_metric3d_main"
    prompthmr_root: "thirdparty/PromptHMR"
    gvhmr_root: "thirdparty/GVHMR"
    # 滑动窗口参数
    window_size: 21
    stride: 5
    sigma: 5.0
    # 优化参数
    opt_steps: 50
    opt_lr: 0.01
    # 损失权重
    loss_reproj_w: 0.5
    loss_depth_w: 10.0
    loss_smooth_vel_w: 0.25
    loss_smooth_acc_w: 0.25
    loss_contact_vel_w: 1000.0
    loss_contact_height_w: 10.0
    loss_floor_w: 100.0
    loss_reg_w: 0.1
    # 功能开关
    enable_depth_constraint: true
    enable_ik: false
    enable_orient_refine: false
    opt_contact: false
    # 深度帧采样
    depth_frame_stride: 5
    metric3d_batch_size: 4
    save_depth_maps: false
    fps: 30
    device: "cuda"
    cache:
      enabled: true
      use_cache: false
      overwrite: true

  # 5. Adjacent Frame SMPL Rendering
  - type: adjacent_smpl_renderer
    name: adjacent_frame_rendering
    pre_dis: 5
    num_adjacent_frames: 2
    device: "cuda"
    render_mode: "world"  # GT 模式：直接使用世界坐标系 trans 渲染，避免 Y 轴偏移
    cache:
      enabled: true
      use_cache: false  # 设为 true 时直接读取 adjacent_smpl 目录的图片
      overwrite: true   # 设为 true 时删除原目录下所有图片再重新渲染

  # # 6. 滑步消除
  # - type: skating_removal
  #   name: skating_removal
  #   gvhmr_root: "thirdparty/GVHMR"
  #   enable_static_joint: true
  #   enable_ik: true
  #   device: "cuda"
  #   cache:
  #     enabled: true
  #     use_cache: false
  #     overwrite: true

  # 7. 评估
  - type: evaluation
    name: evaluation
    metrics:
      - pa_mpjpe
      - mpjpe
      - pve
      - accel
    chunk_length: 100
    fps: 30

# Hooks: OAR 前后可视化对比
hooks:

  - stage: 'after_world_transform'
    function: 'lib.pipeline.hooks.visualize_incam_global_gvhmr'
    enabled: true
    params:
      output_subdir: 'incam_global_pre_oar'
      frame_range: [0, 50]

  - stage: 'after_oar_refine'
    function: 'lib.pipeline.hooks.visualize_incam_global_gvhmr'
    enabled: true
    params:
      output_subdir: 'incam_global_post_oar'
      frame_range: [0, 50]

  - stage: 'after_skating_removal'
    function: 'lib.pipeline.hooks.visualize_incam_global_gvhmr'
    enabled: true
    params:
      output_subdir: 'incam_global_post_skating'
      frame_range: [0, 50]

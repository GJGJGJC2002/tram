# PromptHMR Video Base + Warmstart Pipeline (EMDB1 - InCam Evaluation)
# 基于 promptbase_video_emdb1，增加 AdjacentSMPLRenderer + droid_warmstart
# 将 adjacent_smpl_renderer 的所有渲染帧索引（rendered_indices）作为 forced keyframes
# 不需要第一次 SLAM
#
# Pipeline 流程：
#   1. Segmentation (SAM) - 人体分割
#   2. HPE (PromptHMR) - PromptHMR 推理（输出 global + incam 两套参数）
#   3. SkatingRemoval - 滑步消除（pp_static_joint + IK）
#   4. AdjacentSMPLRenderer (gvhmr_world) - 用 T_w2c 渲染邻帧 SMPL
#   5. SLAM (droid_warmstart) - 使用渲染帧索引作为 forced keyframes + warmstart 策略
#   6. Evaluation - 评估指标（仅 incam）

name: "PromptHMR Video Base + Warmstart Pipeline (EMDB1)"
mode: "sequential"
device: "cuda"
output_dir: "results/promptbase_video_depthrefine_emdb2_woMask"

components:
  - type: segmentation
    name: human_segmentation
    backend: sam
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  - type: slam
    name: camera_estimation
    backend: droid
    use_masks: true
    align_to_world: true
    return_keyframe_info: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 2. PromptHMR Preprocessing (HPE)
  - type: hpe
    name: gvhmr_preprocessing
    backend: prompthmr
    prompthmr_root: "../PromptHMR"
    gvhmr_root: "thirdparty/GVHMR"
    static_cam: true #PromptHMR的video head是不包含相机变化的
    f_mm: null
    phmr_ckpt: "data/pretrain/phmr/checkpoint.ckpt"
    phmr_vid_cfg: "data/pretrain/phmr_vid/prhmr_release_002.yaml"
    phmr_vid_ckpt: "data/pretrain/phmr_vid/prhmr_release_002.ckpt"
    mask_prompt: true
    img_size: 896
    use_mean_shape: true
    # 子步骤缓存：VitPose + Image Model 结果缓存到磁盘
    substep_cache_use: false
    substep_cache_overwrite: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false
      
  - type: world_transform
    name: world_transform
    use_smooth_cam: true
    device: "cuda"
    cache:
      enabled: true
      use_cache: false
      overwrite: true

  - type: depth_scene_refine
    name: oar_refine
    metric3d_model: "metric3d_vit_small"
    metric3d_root: "thirdparty/PromptHMR/pipeline/yvanyin_metric3d_main"
    prompthmr_root: "thirdparty/PromptHMR"
    gvhmr_root: "thirdparty/GVHMR"
    # 滑动窗口参数
    window_size: 21
    stride: 5
    sigma: 5.0
    # 优化参数
    opt_steps: 2
    opt_lr: 0.01
    # 损失权重
    loss_reproj_w: 1000
    loss_depth_w: 1.0
    loss_smooth_vel_w: 0.25
    loss_smooth_acc_w: 0.25
    loss_reg_w: 0.1
    # 功能开关
    enable_depth_constraint: true
    enable_ik: true
    # 窗口内滑步修正模式: ik / pp_static_joint / none
    #   ik:              旋转矩阵空间加权平均修正 body_pose
    #   pp_static_joint: 只修 transl（静态关节位移修正平移，pose准时推荐）
    #   none:            不做窗口内滑步修正
    window_skating_mode: "ik"
    enable_orient_refine: false       # 不修改全局 orientation，仅修正 transl
    # 图像模型 3D body pose 纠正（保留但关闭）
    enable_img_pose_refine: true
    img_pose_opt_steps: 30
    img_pose_opt_lr: 0.005
    loss_img3d_w: 5.0
    loss_img3d_sigma: 0.1
    loss_bodypose_reg_w: 0.1
    # 杂项
    save_depth_maps: false
    fps: 30
    device: "cuda"
    # 窗口渲染偏移（渲染 pre/post debug 图时的帧偏移列表）
    render_offsets: [-10, -5, 0, 5, 10]
    # OAR 诊断可视化（深度图、2D关键点、重投影误差）
    vis_oar_diagnostics: true
    vis_oar_frame_stride: 5
    cache:
      enabled: true
      use_cache: true
      overwrite: false


  #4. Adjacent Frame SMPL Rendering (gvhmr_world mode)
  - type: adjacent_smpl_renderer
    name: adjacent_frame_rendering
    pre_dis: 5
    num_adjacent_frames: 2
    device: "cuda"
    render_mode: "prompthmr_camera"
    frame_selection_mode: "uniform"
    mesh_color_mode: "colorful"
    uniform_mesh_color: [0.75, 0.75, 0.75]
    mesh_render_style: "solid"  # 'solid' (实心填充) 或 'contour' (只画轮廓边缘，保留背景纹理)
    contour_thickness: 3  # contour 模式下轮廓线宽度（像素）
    gvhmr_root: "thirdparty/GVHMR"
    cache:
      enabled: true
      use_cache: false
      overwrite: true

  # 5. SLAM Warmstart (使用 rendered_indices 作为 forced keyframes)
  # 无需第一次 SLAM，自动从 adjacent_render_info 获取关键帧列表
  - type: slam
    name: camera_estimation_warmstart
    backend: droid_warmstart
    use_masks: true
    align_to_world: true
    image_dir: null  # 自动从 adjacent_render_info 获取
    enable_scale_alignment: false  # 无第一次 SLAM，不做尺度对齐
    use_warmstart_poses: false
    use_rendered_for_keyframes: true  # 关键帧使用渲染图像（带 SMPL mesh）
    keyframe_render_mode: "adaptive"  # 所有关键帧（即所有渲染帧）都使用渲染图像
    texture_threshold: 100
    cache:
      enabled: true
      use_cache: false
      overwrite: true

  # 6. Evaluation (EMDB1: incam metrics only)
  - type: evaluation
    name: evaluation
    metrics:
      - pa_mpjpe
      - mpjpe
      - pve
      - accel
      - w_mpjpe
      - wa_mpjpe
      - rte
      - erve
      - ate
      - ate_s
    chunk_length: 100
    fps: 30


# Hooks
hooks:
  - stage: 'after_camera_estimation_warmstart'
    function: 'lib.pipeline.hooks.visualize_camera_trajectory'
    enabled: true

  - stage: 'after_gvhmr_preprocessing'
    function: 'lib.pipeline.hooks.visualize_incam_global_gvhmr'
    enabled: true
    params:
      output_subdir: 'incam_global_pre_skating'
      frame_range: [0, 5]

  - stage: 'before_evaluation'
    function: 'lib.pipeline.hooks.visualize_incam_global_gvhmr'
    enabled: true
    params:
      output_subdir: 'incam_global_before_eval'
      frame_range: [0, 5]

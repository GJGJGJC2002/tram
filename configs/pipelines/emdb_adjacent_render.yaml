# EMDB Adjacent Frame Rendering Pipeline
# 渲染相邻帧SMPL mesh的Pipeline配置

name: "EMDB Adjacent Frame Rendering"
mode: "sequential"
device: "cuda"
output_dir: "results/emdb_adjacent_render"

# Save intermediate results for debugging
save_intermediate: false

components:
  # 1. Human Detection
  - type: detection
    name: human_detection
    backend: vitdet
    threshold: 0.5
    min_size: 100
    max_detections: 10
    arrange_mode: size
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 2. Human Segmentation (for SLAM masking)
  - type: segmentation
    name: human_segmentation
    backend: sam
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 3. Camera Motion Estimation (SLAM)
  - type: slam
    name: camera_estimation
    backend: droid
    use_masks: true
    align_to_world: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 4. Human Pose Estimation (TRAM/VIMO SMPL)
  - type: hpe
    name: hpe_estimation
    backend: vimo  # VIMO是TRAM的HPE实现
    mode: accurate
    use_mean_shape: true
    frame_stride: 1
    cache:
      enabled: true
      use_cache: true
      overwrite: true  # 强制重新计算，避免使用旧缓存

  # 5. Adjacent Frame SMPL Rendering
  # 注意：不要使用gt_smpl_loader，因为它会覆盖TRAM的结果
  # 直接在adjacent_smpl_renderer中读取GT annotations
  - type: adjacent_smpl_renderer
    name: adjacent_frame_rendering
    pre_dis: 20  # 相邻帧间隔，可以调整这个参数
    device: "cuda"  # 或 "cpu"
    output_dir: "results/emdb_adjacent_render"
    save_gt: true  # 是否同时渲染GT
    render_gt_only: false  # 如果只想看GT，设为true

# Hooks configuration (可选，用于额外的可视化)
hooks:
  # Camera trajectory visualization
  - stage: 'after_camera_estimation'
    function: 'lib.pipeline.hooks.visualize_camera_trajectory'
    enabled: True

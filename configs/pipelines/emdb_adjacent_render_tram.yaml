# EMDB Adjacent Frame Rendering Pipeline (TRAM/VIMO)
# 使用TRAM预测的SMPL参数进行渲染

name: "EMDB Adjacent Frame Rendering - TRAM"
mode: "sequential"
device: "cuda"
output_dir: "results/emdb_adjacent_render_tram"

components:
  # 1. Human Detection
  - type: detection
    name: human_detection
    backend: vitdet
    threshold: 0.5
    min_size: 100
    max_detections: 10
    arrange_mode: size
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 2. Human Segmentation
  - type: segmentation
    name: human_segmentation
    backend: sam
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 3. Camera Motion Estimation (SLAM)
  - type: slam
    name: camera_estimation
    backend: droid
    use_masks: true
    align_to_world: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 4. Human Pose Estimation (TRAM/VIMO)
  - type: hpe
    name: hpe_estimation
    backend: vimo
    mode: accurate
    use_mean_shape: true
    frame_stride: 1
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 5. Adjacent Frame SMPL Rendering
  - type: adjacent_smpl_renderer
    name: adjacent_frame_rendering
    pre_dis: 20
    device: "cuda"
    output_dir: "results/emdb_adjacent_render_tram"

# Hooks
hooks:
  - stage: 'after_camera_estimation'
    function: 'lib.pipeline.hooks.visualize_camera_trajectory'
    enabled: True

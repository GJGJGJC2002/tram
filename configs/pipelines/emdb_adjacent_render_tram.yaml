# EMDB Adjacent Frame Rendering Pipeline (TRAM/VIMO)
# 使用TRAM预测的SMPL参数进行渲染
# 然后使用渲染后的图像重新运行DROID-SLAM并插值回原始帧数

name: "EMDB Adjacent Frame Rendering - TRAM"
mode: "sequential"
device: "cuda"
output_dir: "results/emdb_adjacent_render_tram"

components:
  # 1. Human Detection
  - type: detection
    name: human_detection
    backend: vitdet
    threshold: 0.5
    min_size: 100
    max_detections: 10
    arrange_mode: size
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 2. Human Segmentation
  - type: segmentation
    name: human_segmentation
    backend: sam
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 3. Camera Motion Estimation (SLAM)
  - type: slam
    name: camera_estimation
    backend: droid
    use_masks: true
    align_to_world: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 4. Human Pose Estimation (TRAM/VIMO)
  - type: hpe
    name: hpe_estimation
    backend: vimo
    mode: accurate
    use_mean_shape: true
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  # 5. Adjacent Frame SMPL Rendering
  - type: adjacent_smpl_renderer
    name: adjacent_frame_rendering
    pre_dis: 3
    num_adjacent_frames: 2
    device: "cuda"
    render_mode: "camera" # 使用相机坐标系渲染, 用的是选择四元角，"world"用的GT

  # 6. Camera Motion Estimation (SLAM on rendered images with interpolation)
  - type: slam
    name: camera_estimation_tiaozhen
    backend: droid_tiaozhen
    use_masks: ture  # 不使用 mask，因为已经在渲染时去除了人体
    align_to_world: true
    image_dir: null  # 自动从 adjacent_render_info 中获取，拼接 sequence_name
    cache:
      enabled: true
      use_cache: true
      overwrite: false

  - type: evaluation
    name: evaluation
    metrics:
      - pa_mpjpe
      - mpjpe
      - pve
      - accel
      - w_mpjpe
      - wa_mpjpe
      - rte
      - erve
      - ate
      - ate_s
    chunk_length: 100
    fps: 30

# Hooks
hooks:
  # Initial camera trajectory visualization
  - stage: 'after_camera_estimation'
    function: 'lib.pipeline.hooks.visualize_camera_trajectory'
    enabled: True

  # # SMPL mesh visualization
  # - stage: 'after_hpe_estimation'
  #   function: 'lib.pipeline.hooks.visualize_smpl_mesh'
  #   enabled: True
  #   params:
  #     interval: 20

  # Body trajectory visualization
  - stage: 'after_hpe_estimation'
    function: 'lib.pipeline.hooks.visualize_body_trajectory'
    enabled: True

  # Re-run camera trajectory visualization (after interpolation)
  - stage: 'after_camera_estimation_tiaozhen'
    function: 'lib.pipeline.hooks.visualize_camera_trajectory'
    enabled: True

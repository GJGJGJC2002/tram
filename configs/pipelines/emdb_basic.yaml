# EMDB Basic Pipeline Configuration
# 基础的两阶段 Pipeline：相机估计 -> 人体估计

name: "EMDB Basic Pipeline"
mode: "sequential"
device: "cuda"
output_dir: "results/emdb"

# Save intermediate results for debugging
save_intermediate: false

components:
  # 1. Human Detection
  - type: detection
    name: human_detection
    backend: vitdet
    threshold: 0.5
    min_size: 100
    max_detections: 10
    arrange_mode: size
    cache:
      enabled: true      # 启用缓存，保存检测结果
      use_cache: true    # 使用缓存，如果存在则跳过执行
      overwrite: false   # 不覆盖已有缓存（设为true强制重新执行）

  # 2. Human Segmentation (for SLAM masking)
  - type: segmentation
    name: human_segmentation
    backend: sam
    cache:
      enabled: true     # 不缓存（依赖于detection结果）
      use_cache: true
      overwrite: false

  # 3. Camera Motion Estimation (SLAM)
  - type: slam
    name: camera_estimation
    backend: droid
    use_masks: true
    align_to_world: true
    cache:
      enabled: true      # 启用缓存，SLAM通常很慢
      use_cache: true
      overwrite: false

  # 4. Human Pose Estimation
  - type: hpe
    name: smpl_estimation
    backend: vimo
    mode: accurate  # 'accurate' or 'efficient'
    use_mean_shape: true
    frame_stride: 1   # 跳帧步长，1=不跳帧，20=每20帧取一次
    max_frames: null     # 最大处理帧数，null=全部
    cache:
      enabled: true      # 启用缓存，保存 SMPL 估计结果
      use_cache: true    # 使用缓存，如果存在则跳过执行
      overwrite: false   # 不覆盖已有缓存（设为true强制重新执行）

  # 5. Evaluation
  - type: evaluation
    name: evaluation
    metrics:
      - pa_mpjpe
      - mpjpe
      - pve
      - accel
      - w_mpjpe
      - wa_mpjpe
      - rte
      - erve
      - ate
      - ate_s
    chunk_length: 100
    fps: 30

# Hooks configuration
hooks:
  # SMPL mesh visualization (every 20 frames)
  - stage: 'after_smpl_estimation'
    function: 'lib.pipeline.hooks.visualize_smpl_mesh'
    enabled: True
    params:
      interval: 20
